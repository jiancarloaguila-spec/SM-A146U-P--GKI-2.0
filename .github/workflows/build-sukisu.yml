name: Build SM-A146U/P SukiSU-Ultra Kernel

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: "SukiSU-Ultra branch"
        required: true
        default: "main"
        type: choice
        options:
          - main

      localversion:
        description: "Kernel version suffix"
        required: true
        default: "-SukiSU-Ultra"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build SukiSU-Ultra Kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # 1. Free runner storage
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

      # 2. Download repository
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      # 3. Install compiler and dependencies
      - name: Install Build Dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            libelf-dev libncurses-dev libssl-dev \
            libxml2-utils lz4 python3 python-is-python3 \
            rsync unzip wget zip cpio \
            device-tree-compiler dwarves \
            clang-18 lld-18 llvm-18

          echo "Checking compiler..."
          clang-18 --version
          ld.lld-18 --version
          llvm-ar-18 --version

      # 4. Verify and locate kernel source paths
      - name: Verify Kernel Source
        run: |
          set -e
          echo "Repository root:"
          pwd
          ls -lah

          echo "Checking build script..."
          test -f build_kernel.sh
          cat build_kernel.sh

          echo "Locating drivers directory..."
          DRIVERS_PATH=$(find . -maxdepth 3 -type d -name "drivers" | head -n 1)
          if [ -z "$DRIVERS_PATH" ]; then
            echo "ERROR: Could not find drivers directory."
            exit 1
          fi
          KERNEL_DIR=$(dirname "$DRIVERS_PATH")
          echo "Found kernel source root at: $KERNEL_DIR"

          echo "Locating configuration files..."
          find . -maxdepth 4 \( -name "*.config" -o -name "*defconfig" \)

      # 5. Integrate SukiSU-Ultra
      - name: Integrate SukiSU-Ultra
        env:
          KSU_BRANCH: ${{ inputs.ksu_branch }}
        run: |
          set -e
          DRIVERS_PATH=$(find . -maxdepth 3 -type d -name "drivers" | head -n 1)
          KERNEL_DIR=$(dirname "$DRIVERS_PATH")

          echo "Running SukiSU-Ultra setup inside $KERNEL_DIR..."
          cd "$KERNEL_DIR"

          curl -fLSs \
            https://githubusercontent.com \
            -o /tmp/ksu-setup.sh

          bash /tmp/ksu-setup.sh "$KSU_BRANCH"
          echo "SukiSU-Ultra integration completed."

      # 6. Configure SukiSU-Ultra
      - name: Configure Kernel
        env:
          LOCALVERSION: ${{ inputs.localversion }}
        run: |
          set -e
          CONFIG=$(find . -maxdepth 4 -name "S96901AA1.config" | head -n 1)

          if [ -z "$CONFIG" ]; then
            echo "ERROR: S96901AA1.config not found anywhere in the repo."
            find . -maxdepth 4 \( -name "*.config" -o -name "*defconfig" \)
            exit 1
          fi

          echo "Updating $CONFIG"

          sed -i -E \
            '/^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_KRETPROBES|CONFIG_LOCALVERSION)=/d' \
            "$CONFIG"

          cat >> "$CONFIG" <<EOF

# SukiSU-Ultra
CONFIG_KSU=y
CONFIG_KPROBES=y
CONFIG_KRETPROBES=y
CONFIG_LOCALVERSION="${LOCALVERSION}"
EOF

          echo "Final configuration:"
          cat "$CONFIG"

      # 7. Compile MediaTek kernel
      - name: Build Kernel
        run: |
          set -e
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="/usr/lib/llvm-18/bin:$PATH"

          chmod +x build_kernel.sh
          bash build_kernel.sh

      # 8. Check compiled output
      - name: Verify Build Output
        run: |
          set -e
          DIST="out/target/product/a14xm/obj/KLEAF_OBJ/dist"

          if [ ! -d "$DIST" ]; then
            echo "ERROR: Build output directory missing."
            echo "Searching for generated kernel files..."
            find out -type f 2>/dev/null | head -100 || true
            exit 1
          fi

          echo "Generated files:"
          ls -lah "$DIST"

          if ! find "$DIST" -type f | grep -q .; then
            echo "ERROR: No build artifacts found."
            exit 1
          fi

          echo "Build output verified."

      # 9. Upload artifacts
      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SM-A146U-P-SukiSU-Ultra-${{ github.run_number }}
          path: out/target/product/a14xm/obj/KLEAF_OBJ/dist/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
