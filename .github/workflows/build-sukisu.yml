name: Build SM-A146U/P SukiSU-Ultra Kernel

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: "SukiSU-Ultra branch"
        required: true
        default: "main"
        type: choice
        options:
          - main

      enable_kpm:
        description: "Disable KPM support"
        required: true
        type: boolean
        default: false

      localversion:
        description: "Kernel version suffix"
        required: true
        default: "-SukiSU-Ultra"

permissions:
  contents: read

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install Dependencies and Clang 18
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            libelf-dev libncurses-dev libssl-dev libxml2-utils \
            lz4 python3 python-is-python3 rsync unzip wget zip \
            cpio device-tree-compiler dwarves \
            clang-18 lld-18 llvm-18

          clang-18 --version
          ld.lld-18 --version
          llvm-ar-18 --version

