name: Build SM-A146U/P SukiSU-Ultra Kernel

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: 'SukiSU-Ultra branch (main = latest)'
        required: true
        default: 'main'
      enable_kpm:
        description: 'Enable KPM (Kernel Patch Module) support'
        type: boolean
        default: false
      localversion:
        description: 'Custom kernel version suffix'
        required: false
        default: '-SukiSU-Ultra'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Quick Disk Cleanup (2 Seconds)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies & Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git \
            libelf-dev libncurses5-dev libssl-dev libxml2-utils lz4 python3 \
            python-is-python3 rsync unzip wget zip cpio device-tree-compiler \
            dwarves clang-18 lld-18 llvm-18

          for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            sudo ln -sf /usr/bin/${tool}-18 /usr/bin/${tool}
          done

      - name: Setup SukiSU-Ultra in kernel-6.6
        working-directory: kernel-6.6
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.ksu_branch }} https://github.com KernelSU
          bash KernelSU/kernel/setup.sh

      - name: Configure gki_defconfig for SukiSU-Ultra & Samsung GKI
        working-directory: kernel-6.6
        run: |
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          
          cat <<EOF >> "$DEFCONFIG"
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_LOCALVERSION="${{ github.event.inputs.localversion }}"
          EOF

          if [ "${{ github.event.inputs.enable_kpm }}" = "true" ]; then
            cat <<EOF >> "$DEFCONFIG"
          CONFIG_KPM=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF
          fi

          sed -i 's/CONFIG_TRIM_UNUSED_KSYMS=y/# CONFIG_TRIM_UNUSED_KSYMS is not set/g' "$DEFCONFIG"

      - name: Compile Kernel 6.6 GKI Image
        working-directory: kernel-6.6
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image Image.gz

      - name: Repack boot.img with Stock Release
        run: |
          mkdir -p release stock
          cp kernel-6.6/out/arch/arm64/boot/Image release/
          cp kernel-6.6/out/arch/arm64/boot/Image.gz release/

          gh release download "Stock-boot.img" -p "boot.img" -D stock/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Pack boot.img.zip and Odin .tar
        run: |
          if [ -s stock/boot.img ]; then
            mkdir -p repack && cd repack
            gh release download v28.1 -R topjohnwu/Magisk -p "Magisk-v28.1.apk"
            unzip -q Magisk-v28.1.apk lib/x86_64/libmagiskboot.so
            mv lib/x86_64/libmagiskboot.so magiskboot && chmod +x magiskboot

            cp ../stock/boot.img .
            ./magiskboot unpack boot.img
            cp ../release/Image kernel
            ./magiskboot repack boot.img new-boot.img
            cp new-boot.img ../release/boot.img
            cd ../release
            zip -r boot.img.zip boot.img
            tar -cvf SM-A146U-P-SukiSU-Ultra-Odin.tar boot.img
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SM-A146U-P-SukiSU-Ultra-${{ github.run_number }}
          path: release/*
