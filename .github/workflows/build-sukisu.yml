
name: Build SM-A146U/P SukiSU-Ultra Kernel

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: "SukiSU-Ultra branch"
        required: true
        default: "main"
        type: choice
        options:
          - main

      enable_kpm:
        description: "Enable KPM support"
        required: true
        type: boolean
        default: false

      localversion:
        description: "Kernel version suffix"
        required: true
        default: "-SukiSU-Ultra"

permissions:
  contents: read

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install Dependencies and Clang 18
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            libelf-dev libncurses-dev libssl-dev libxml2-utils \
            lz4 python3 python-is-python3 rsync unzip wget zip \
            cpio device-tree-compiler dwarves \
            clang-18 lld-18 llvm-18

          clang-18 --version
          ld.lld-18 --version
          llvm-ar-18 --version

      
      - name: Verify Kernel Source
        run: |
          set -e

          echo "Checking repository structure..."
          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -lah

          echo "Checking kernel directories..."

          for dir in kernel kernel-6.6; do
            if [ -d "$dir" ]; then
              echo "FOUND: $dir"
              ls -lah "$dir" | head -20
            else
              echo "NOT FOUND: $dir"
            fi
          done

          echo "Checking build script..."

          if [ -f build_kernel.sh ]; then
            echo "FOUND: build_kernel.sh"
          else
            echo "ERROR: build_kernel.sh is missing from repository root."
            exit 1
          fi

          echo "Source verification completed."
          run: |
          set -e

          test -f build_kernel.sh
          test -d kernel
          test -d kernel_device_modules-6.6

          echo "Kernel source verified."

      - name: Integrate SukiSU-Ultra
        working-directory: kernel
        env:
          KSU_BRANCH: ${{ inputs.ksu_branch }}
        run: |
          set -e

          curl -LSs \
            https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh \
            -o /tmp/ksu-setup.sh

          bash /tmp/ksu-setup.sh "$KSU_BRANCH"

      - name: Configure SukiSU-Ultra
        env:
          ENABLE_KPM: ${{ inputs.enable_kpm }}
          LOCALVERSION: ${{ inputs.localversion }}
        run: |
          set -e

          OVERLAY="$(find . -type f \
            -name 'S96901AA1.config' -print -quit)"

          if [ -z "$OVERLAY" ]; then
            echo "ERROR: S96901AA1.config not found."
            exit 1
          fi

          echo "Editing configuration: $OVERLAY"

          sed -i -E \
            '/^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KPROBES|CONFIG_KRETPROBES|CONFIG_EXT4_FS|CONFIG_KPM|CONFIG_KALLSYMS|CONFIG_KALLSYMS_ALL)=/d' \
            "$OVERLAY"

          cat >> "$OVERLAY" <<EOF

          # SukiSU-Ultra configuration
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_KRETPROBES=y
          CONFIG_EXT4_FS=y
          CONFIG_LOCALVERSION="${LOCALVERSION}"
          EOF

          if [ "$ENABLE_KPM" = "true" ]; then
            cat >> "$OVERLAY" <<EOF
          CONFIG_KPM=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF
          else
            echo "# CONFIG_KPM is not set" >> "$OVERLAY"
          fi

          echo "SukiSU-Ultra configuration completed."
          cat "$OVERLAY"

      - name: Build Kernel
        run: |
          set -e

          chmod +x build_kernel.sh

          bash build_kernel.sh

      - name: Verify Build Output
        run: |
          set -e

          DIST="out/target/product/a14xm/obj/KLEAF_OBJ/dist"

          if [ ! -d "$DIST" ]; then
            echo "ERROR: Kernel output directory not found."
            exit 1
          fi

          echo "Build output:"
          ls -lah "$DIST"

          if ! find "$DIST" -type f | grep -q .; then
            echo "ERROR: No kernel artifacts found."
            exit 1
          fi

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SM-A146U-P-SukiSU-Ultra-${{ github.run_number }}
          path: |
            out/target/product/a14xm/obj/KLEAF_OBJ/dist/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
