name: Build SM-A146P GKI 2.0 SukiSU

on:
  workflow_dispatch:

jobs:
  gki_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libcrypto++-dev \
          libncurses-dev lld llvm libelf-dev zip openjdk-17-jdk repo python3-pip

      - name: Setup AOSP Clang Toolchain
        run: |
          mkdir -p clang
          cd clang
          curl -fSL -o clang.tar.gz https://github.com/ZyCromerZ/Clang/releases/download/19.0.0-20240416-release/Clang-19.0.0-20240416.tar.gz
          tar -
