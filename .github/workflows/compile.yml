name: Build SM-A146P GKI 2.0 SukiSU

on:
  workflow_dispatch:

jobs:
  gki_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libcrypto++-dev \
          libncurses-dev lld llvm libelf-dev zip openjdk-17-jdk repo python3-pip

      - name: Setup AOSP Clang Toolchain
        run: |
          mkdir -p clang
          cd clang
          curl -fSL -o clang.tar.gz https://github.com/SA9990/Toolchain/releases/download/clang-r536225/clang-r536225.tar.gz
          tar -xzf clang.tar.gz
          rm -f clang.tar.gz
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Inject GKI Configs (OverlayFS & KPM)
        run: |
          # Target standard GKI defconfig path used in 6.6 trees
          GKI_DEFCONFIG="common/arch/arm64/configs/gki_defconfig"
          if [ -f "$GKI_DEFCONFIG" ]; then
            python3 common/scripts/config --file "$GKI_DEFCONFIG" --enable CONFIG_OVERLAY_FS
            python3 common/scripts/config --file "$GKI_DEFCONFIG" --enable CONFIG_TMPFS_XATTR
            python3 common/scripts/config --file "$GKI_DEFCONFIG" --enable CONFIG_TMPFS_POSIX_ACL
            python3 common/scripts/config --file "$GKI_DEFCONFIG" --enable CONFIG_KALLSYMS
            python3 common/scripts/config --file "$GKI_DEFCONFIG" --enable CONFIG_KALLSYMS_ALL
            python3 common/scripts/config --file "$GKI_DEFCONFIG" --enable CONFIG_KPM
          fi
          
          # Bypass strict AOSP ABI defconfig checks
          if [ -f "common/build.config.gki" ]; then
            sed -i 's/check_defconfig//' common/build.config.gki
          fi

      - name: Run Build Script
        run: |
          chmod +x build_kernel.sh
          ./build_kernel.sh

      - name: Package AnyKernel3 Flashable Zip
        run: |
          git clone https://github.com/kernel-swaps/AnyKernel3 -b master AnyKernel3
          
          # Fixed path check for Android 15 6.6 GKI dist outputs
          if [ -f out/android15-6.6/dist/Image ]; then
            cp out/android15-6.6/dist/Image AnyKernel3/
          elif [ -f out/kernel-6.6/arch/arm64/boot/Image ]; then
            cp out/kernel-6.6/arch/arm64/boot/Image AnyKernel3/
          else
            FOUND_IMG=$(find . -name "Image" | head -n 1)
            if [ -n "$FOUND_IMG" ]; then
              cp "$FOUND_IMG" AnyKernel3/
            else
              echo "Error: Compiled Image not found!"
              exit 1
            fi
          fi
          
          cd AnyKernel3
          zip -r9 ../SukiSU-GKI-SM-A146P.zip * -x .git* README.md

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-GKI-SM-A146P-Build
          path: SukiSU-GKI-SM-A146P.zip
