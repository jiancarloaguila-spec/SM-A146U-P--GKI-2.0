name: Build SM-A146P GKI 2.0 SukiSU LKM

on:
  workflow_dispatch:

jobs:
  gki_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # In case your modules point to tracking submodules

      - name: Install Android Kernel Tooling Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libcrypto++-dev \
          libncurses-dev ccly-utils libelf-dev zip openjdk-17-jdk repo

      - name: Setup Toolchain
        run: |
          mkdir -p clang
          cd clang
          # Pulls the standard AOSP Clang aligned with modern 6.x Android kernels
          curl -LO https://googlesource.com
          tar -xzf clang-r450784d.tar.gz
          rm -f clang-r450784d.tar.gz
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Execute Existing Native Kernel Build
        run: |
          chmod +x build_kernel.sh
          ./build_kernel.sh

      - name: Package GKI Image and SukiSU LKM
        run: |
          git clone https://github.com AnyKernel3
          
          # Find and copy your newly compiled GKI Image
          # Usually located inside your unified output folder 'out/arch/arm64/boot/'
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          elif [ -f kernel-6.6/arch/arm64/boot/Image ]; then
            cp kernel-6.6/arch/arm64/boot/Image AnyKernel3/
          fi
          
          # Bundle the Loadable Kernel Module
          mkdir -p AnyKernel3/modules
          if [ -d out/suki_module ]; then
            cp out/suki_module/*.ko AnyKernel3/modules/
          fi
          
          # Compress flashable zip archive
          cd AnyKernel3
          zip -r9 ../SukiSU-GKI-SM-A146P.zip * -x .git* README.md

      - name: Upload Flashable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-GKI-Build
          path: SukiSU-GKI-SM-A146P.zip
