name: Build SM-A146P GKI 2.0 SukiSU boot.zip

on:
  workflow_dispatch:

jobs:
  gki_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libcrypto++-dev \
          libncurses-dev lld llvm libelf-dev zip openjdk-17-jdk repo python3-pip

      - name: Setup AOSP Clang Toolchain
        run: |
          mkdir -p clang
          cd clang
          curl -fSL -o clang.tar.gz https://github.com/SA9990/Toolchain/releases/download/clang-r536225/clang-r536225.tar.gz
          tar -xzf clang.tar.gz
          rm -f clang.tar.gz
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Run Build Script
        run: |
          chmod +x build_kernel.sh
          ./build_kernel.sh

      - name: Pack into boot.zip via magiskboot
        run: |
          # 1. Download stock boot.img for SM-A146P (or place yours in the repo and reference it)
          # For now, let's download a helper tool and magiskboot
          curl -LO https://github.com/topjohnwu/Magisk/releases/download/v26.3/Magisk-v26.3.apk
          unzip Magisk-v26.3.apk lib/arm64-v8a/libmagiskboot.so
          mv lib/arm64-v8a/libmagiskboot.so magiskboot
          chmod +x magiskboot

          # 2. Assume stock boot.img is placed in your repo root, or fetch it
          if [ ! -f "boot.img" ]; then
            echo "Error: Please place your stock boot.img in the root of your repository!"
            exit 1
          fi

          # 3. Unpack stock boot.img
          ./magiskboot unpack boot.img

          # 4. Replace kernel with our newly compiled SukiSU Image
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image kernel
          else
            echo "Error: Compiled Image not found!"
            exit 1
          fi

          # 5. Repack into new boot.img
          ./magiskboot repack boot.img boot-sukisu.img

          # 6. Compress into boot.zip
          mkdir -p boot_release
          mv boot-sukisu.img boot_release/boot.img
          cd boot_release
          zip -r9 ../boot.zip boot.img

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Boot-Image-SM-A146P
          path: boot.zip
